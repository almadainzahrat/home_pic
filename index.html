
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>عقارات زهرة المدائن</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        .gallery-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .gallery {
            display: flex;
            gap: 30px;
            height: 100%;
            width: fit-content;
            animation: scroll-left 800s linear infinite;
        }

        .gallery img {
            height: 100%;
            width: auto;
            object-fit: cover;
            flex-shrink: 0;
        }

        @keyframes scroll-left {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }
    </style>
</head>

<body>
    <div class="gallery-container">
        <div class="gallery" id="imageGallery"></div>
    </div>

    <audio id="bg-music" loop playsinline>
        <source src="a.mp3" type="audio/mpeg">
    </audio>

    <script>
        // Gallery settings
        const gallery = document.getElementById('imageGallery');
        const totalImages = 119;

        // Check whether an image exists and can be loaded
        function checkImage(path) {
            return new Promise((resolve) => {
                const image = new Image();

                image.onload = () => resolve(path);
                image.onerror = () => resolve(null);

                image.src = path;
            });
        }

        // Load images using the filenames in the GitHub repository
        async function loadImages() {
            const imagePaths = [];

            for (let i = 1; i <= totalImages; i++) {
                let path;

                if (i >= 98 && i <= 119) {
                    path = `g/${i}.jpg`;
                } else if (i === 97) {
                    path = `g/${i}.jpg`;
                } else {
                    path = `g/${i}.jpeg`;
                }

                const result = await checkImage(path);

                if (result) {
                    imagePaths.push(result);
                } else {
                    console.warn(`Image not found: ${path}`);
                }
            }

            if (imagePaths.length === 0) {
                console.error('No images could be loaded.');
                return;
            }

            // Duplicate images to create continuous scrolling
            const allImages = [...imagePaths, ...imagePaths];

            gallery.innerHTML = allImages.map(path =>
                `<img src="${path}" alt="عقارات زهرة المدائن">`
            ).join('');

            console.log('Images loaded:', imagePaths.length);
            console.log('Missing images:', totalImages - imagePaths.length);
            console.log('Image list:', imagePaths);
        }

        loadImages();

        // Background music
        (function () {
            const audio = document.getElementById('bg-music');

            if (!audio) return;

            audio.volume = 1.0;

            let started = false;

            function tryPlay() {
                if (started) return;

                audio.play()
                    .then(() => {
                        started = true;
                    })
                    .catch(() => {
                        started = false;
                    });
            }

            window.addEventListener('pointerdown', tryPlay);
            window.addEventListener('touchstart', tryPlay);
            window.addEventListener('click', tryPlay);
            window.addEventListener('keydown', tryPlay);
        })();
    </script>
</body>
</html>
