
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>عقارات زهرة المدائن</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        .gallery-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .gallery {
            display: flex;
            gap: 30px;
            height: 100%;
            width: fit-content;
            animation: scroll-left 800s linear infinite;
        }

        .gallery img {
            height: 100%;
            width: auto;
            object-fit: cover;
            flex-shrink: 0;
        }

        @keyframes scroll-left {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }
    </style>
</head>

<body>
    <div class="gallery-container">
        <div class="gallery" id="imageGallery"></div>
    </div>

    <audio id="bg-music" loop playsinline>
        <source src="a.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. Automatically load all available images
        const gallery = document.getElementById('imageGallery');

        // Highest image number currently uploaded
        const totalImages = 119;

        function loadImages() {
            const imageChecks = [];

            for (let i = 1; i <= totalImages; i++) {
                imageChecks.push(
                    new Promise((resolve) => {
                        const jpegPath = `g/${i}.jpeg`;
                        const jpgPath = `g/${i}.jpg`;

                        const jpegImage = new Image();

                        jpegImage.onload = () => {
                            resolve(jpegPath);
                        };

                        jpegImage.onerror = () => {
                            const jpgImage = new Image();

                            jpgImage.onload = () => {
                                resolve(jpgPath);
                            };

                            jpgImage.onerror = () => {
                                // Skip numbers that do not exist
                                resolve(null);
                            };

                            jpgImage.src = jpgPath;
                        };

                        jpegImage.src = jpegPath;
                    })
                );
            }

            Promise.all(imageChecks).then((results) => {
                const validImages = results.filter((path) => path !== null);

                if (validImages.length === 0) {
                    console.error('No images were found in the g folder.');
                    return;
                }

                // Duplicate the images for continuous scrolling
                const allImages = [...validImages, ...validImages];

                gallery.innerHTML = allImages.map((src) => {
                    return `<img src="${src}" loading="lazy" alt="عقارات زهرة المدائن">`;
                }).join('');
            });
        }

        loadImages();

        // 2. Background music
        (function () {
            const audio = document.getElementById('bg-music');

            if (!audio) return;

            audio.volume = 1.0;

            let started = false;

            function tryPlay() {
                if (started) return;

                started = true;

                audio.play().catch(() => {
                    // Some browsers require another user interaction
                });
            }

            window.addEventListener('pointerdown', tryPlay, { once: true });
            window.addEventListener('touchstart', tryPlay, { once: true });
            window.addEventListener('click', tryPlay, { once: true });
            window.addEventListener('keydown', tryPlay, { once: true });
        })();
    </script>
</body>
</html>
