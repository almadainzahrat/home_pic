        * {

            box-sizing: border-box;

            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;

        .gallery-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .gallery {
            display: flex;
            gap: 30px;
            height: 100%;
            width: fit-content;
            animation: scroll-left 400s linear infinite;
        }

        .gallery img {
            height: 100%;
            width: auto;
            object-fit: cover;
            flex-shrink: 0;
        }

        /* Scrolling animation from right to left - continuous */
        @keyframes scroll-left {
            0% {
                transform: translateX(0);
            }
            100% {
                transform: translateX(-50%);
            }
        }
    </style>
</head>

    <audio id="bg-music" loop playsinline>
        <source src="a.mp3" type="audio/mpeg">
    </audio>
    <!-- Audio Player -->

    <script>
        // Ensure audio plays on page load

            (function() {
            const audio = document.getElementById('bg-music');
            if (!audio) return;

            audio.volume = 1.0;
            let started = false;

            function tryPlay() {
                if (started) return;
                started = true;

                audio.play().catch(() => {});
            }

            window.addEventListener('pointerdown', tryPlay, { once: true });
            window.addEventListener('touchstart', tryPlay, { once: true });
            window.addEventListener('click', tryPlay, { once: true });
            window.addEventListener('keydown', tryPlay, { once: true });
        })();
    </script>
