<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عقارات زهرة المدائن</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        .gallery-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .gallery {
            display: flex;
            gap: 30px;
            height: 100%;
            width: fit-content;
            /* تم زيادة الوقت لـ 800 ثانية لأن عدد الصور أصبح كبيراً جداً */
            animation: scroll-left 800s linear infinite;
        }

        .gallery img {
            height: 100%;
            width: auto;
            object-fit: cover;
            flex-shrink: 0;
        }

        @keyframes scroll-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <div class="gallery-container">
        <div class="gallery" id="imageGallery"></div>
    </div>

    <audio id="bg-music" loop playsinline>
        <source src="a.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. كود توليد الصور تلقائياً
        const gallery = document.getElementById('imageGallery');
        const totalImages = 178; // عدد الصور الكلي

        // نحتاج تكرار الصور مرتين ليعمل الانميشن بشكل متواصل (Infinite Loop)
        function loadImages() {
            let imagesHTML = '';
            // المرة الأولى
            for (let i = 1; i <= totalImages; i++) {
                imagesHTML += `<img src="g/${i}.jpeg" loading="lazy">`;
            }
            // المرة الثانية (للتكرار)
            for (let i = 1; i <= totalImages; i++) {
                imagesHTML += `<img src="g/${i}.jpeg" loading="lazy">`;
            }
            gallery.innerHTML = imagesHTML;
        }

        loadImages();

        // 2. كود تشغيل الموسيقى الخاص بك
        (function() {
            const audio = document.getElementById('bg-music');
            if (!audio) return;
            audio.volume = 1.0;
            let started = false;
            function tryPlay() {
                if (started) return;
                started = true;
                audio.play().catch(() => {});
            }
            window.addEventListener('pointerdown', tryPlay, { once: true });
            window.addEventListener('touchstart', tryPlay, { once: true });
            window.addEventListener('click', tryPlay, { once: true });
            window.addEventListener('keydown', tryPlay, { once: true });
        })();
    </script>
</body>
</html>
