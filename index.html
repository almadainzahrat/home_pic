
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>عقارات زهرة المدائن</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        .gallery-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .gallery {
            display: flex;
            gap: 30px;
            height: 100%;
            width: fit-content;
            animation: scroll-left 800s linear infinite;
        }

        .gallery img {
            height: 100%;
            width: auto;
            object-fit: cover;
            flex-shrink: 0;
        }

        @keyframes scroll-left {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }
    </style>
</head>

<body>
    <div class="gallery-container">
        <div class="gallery" id="imageGallery"></div>
    </div>

    <audio id="bg-music" loop playsinline>
        <source src="a.mp3" type="audio/mpeg">
    </audio>

    <script>
        // 1. Automatically load all available images
        const gallery = document.getElementById('imageGallery');

        // Highest image number currently uploaded
        const totalImages = 119;

        function loadImages() {
            const validImages = [];

            for (let i = 1; i <= totalImages; i++) {
                let extension;

                if (i >= 98) {
                    // New images: 98.jpg to 119.jpg
                    extension = 'jpg';
                } else {
                    // Original images: 1.jpeg to 96.jpeg
                    extension = 'jpeg';
                }

                // Skip image number 97
                if (i === 97) {
                    continue;
                }

                validImages.push(`g/${i}.${extension}`);
            }

            // Duplicate the images for continuous scrolling
            const allImages = [...validImages, ...validImages];

            gallery.innerHTML = allImages.map((src) => {
                return `<img src="${src}" loading="lazy" alt="عقارات زهرة المدائن">`;
            }).join('');

            // Remove any images that cannot be loaded
            gallery.querySelectorAll('img').forEach((img) => {
                img.onerror = function () {
                    console.error('Could not load image:', this.src);
                    this.remove();
                };
            });
        }

        loadImages();

        // 2. Background music
        (function () {
            const audio = document.getElementById('bg-music');

            if (!audio) return;

            audio.volume = 1.0;

            let started = false;

            function tryPlay() {
                if (started) return;

                started = true;

                audio.play().catch(() => {
                    // Some browsers require user interaction
                });
            }

            window.addEventListener('pointerdown', tryPlay, { once: true });
            window.addEventListener('touchstart', tryPlay, { once: true });
            window.addEventListener('click', tryPlay, { once: true });
            window.addEventListener('keydown', tryPlay, { once: true });
        })();
    </script>
</body>
</html>
