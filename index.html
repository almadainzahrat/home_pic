
<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>عقارات زهرة المدائن</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #000;
        }

        .gallery-container {
            width: 100%;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        .gallery {
            display: flex;
            gap: 30px;
            height: 100%;
            width: fit-content;
            animation: scroll-left 800s linear infinite;
        }

        .gallery img {
            height: 100%;
            width: auto;
            object-fit: cover;
            flex-shrink: 0;
        }

        @keyframes scroll-left {
            0% {
                transform: translateX(0);
            }

            100% {
                transform: translateX(-50%);
            }
        }
    </style>
</head>

<body>
    <div class="gallery-container">
        <div class="gallery" id="imageGallery"></div>
    </div>

    <audio id="bg-music" loop playsinline>
        <source src="a.mp3" type="audio/mpeg">
    </audio>

    
<script>
    // 1. Load all available images
    const gallery = document.getElementById('imageGallery');
    const totalImages = 119;

    function checkImage(path) {
        return new Promise((resolve) => {
            const image = new Image();

            image.onload = () => resolve(path);
            image.onerror = () => resolve(null);

            image.src = path;
        });
    }

    async function loadImages() {
        const imagePaths = [];

        for (let i = 1; i <= totalImages; i++) {
            // Check both possible extensions
            const jpegPath = `g/${i}.jpeg`;
            const jpgPath = `g/${i}.jpg`;

            const jpegResult = await checkImage(jpegPath);

            if (jpegResult) {
                imagePaths.push(jpegResult);
                continue;
            }

            const jpgResult = await checkImage(jpgPath);

            if (jpgResult) {
                imagePaths.push(jpgResult);
            }
        }

        if (imagePaths.length === 0) {
            console.error('No images could be loaded.');
            return;
        }

        // Duplicate the complete list for continuous scrolling
        const allImages = [...imagePaths, ...imagePaths];

        gallery.innerHTML = allImages.map((path) =>
            `<img src="${path}" alt="عقارات زهرة المدائن">`
        ).join('');

        console.log('Images loaded:', imagePaths.length);
        console.log('Image list:', imagePaths);
    }

    loadImages();

    // 2. Background music
    (function () {
        const audio = document.getElementById('bg-music');

        if (!audio) return;

        audio.volume = 1.0;

        let started = false;

        function tryPlay() {
            if (started) return;

            started = true;

            audio.play().catch(() => {});
        }

        window.addEventListener('pointerdown', tryPlay, { once: true });
        window.addEventListener('touchstart', tryPlay, { once: true });
        window.addEventListener('click', tryPlay, { once: true });
        window.addEventListener('keydown', tryPlay, { once: true });
    })();
</script>

</body>
</html>
